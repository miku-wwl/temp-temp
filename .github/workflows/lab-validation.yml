name: Independent lab validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-config-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install the pinned parser dependency
        run: python -m pip install --disable-pip-version-check -r labs/prod-config-guard/requirements.txt
      - name: Run policy and CLI regression cases
        run: python -m unittest discover -v -s labs/prod-config-guard/tests
      - name: Validate the production values
        run: python labs/prod-config-guard/guard.py labs/prod-config-guard/envs/prod/values.yaml

  reproducible-archive:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Run archive regression cases
        run: python -m unittest discover -v -s labs/reproducible-archive/tests
      - name: Build the normalized sample archive
        run: python labs/reproducible-archive/pack.py --source labs/reproducible-archive/sample/source --output "$RUNNER_TEMP/sample.tar.gz" --source-date-epoch 1700000000

  supply-chain-consumer:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install the pinned crypto dependency
        run: python -m pip install --disable-pip-version-check -r labs/supply-chain-consumer/requirements.txt
      - name: Run signed SBOM consumer policy tests
        run: python -m unittest discover -v -s labs/supply-chain-consumer/tests

  canary-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Run canary policy tests
        run: python -m unittest discover -v -s labs/canary-gate/tests
      - name: Evaluate promote, hold, and rollback fixtures
        run: |
          python labs/canary-gate/gate.py labs/canary-gate/fixtures/promote.json
          python labs/canary-gate/gate.py labs/canary-gate/fixtures/hold.json
          python labs/canary-gate/gate.py labs/canary-gate/fixtures/rollback.json

  slo-budget:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Run SLO and error-budget tests
        run: python -m unittest discover -v -s labs/slo-budget/tests
      - name: Evaluate SLO fixtures
        run: |
          python labs/slo-budget/calculate.py labs/slo-budget/fixtures/within-budget.json
          python labs/slo-budget/calculate.py labs/slo-budget/fixtures/exhausted.json
          python labs/slo-budget/calculate.py labs/slo-budget/fixtures/at-target.json

  backup-restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Run backup and restore tests
        run: python -m unittest discover -v -s labs/backup-restore/tests
      - name: Create, verify, and restore sample data
        run: |
          python labs/backup-restore/backup.py create --source labs/backup-restore/sample/source --destination "$RUNNER_TEMP/sample-backup"
          python labs/backup-restore/backup.py verify --backup "$RUNNER_TEMP/sample-backup"
          python labs/backup-restore/backup.py restore --backup "$RUNNER_TEMP/sample-backup" --destination "$RUNNER_TEMP/sample-restored"
          python labs/backup-restore/backup.py verify --backup "$RUNNER_TEMP/sample-restored"

  rollout-state:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Run rollout state tests
        run: python -m unittest discover -v -s labs/rollout-state/tests
      - name: Simulate complete, progressing, and rollback outcomes
        run: |
          python labs/rollout-state/simulate.py labs/rollout-state/fixtures/complete.json
          python labs/rollout-state/simulate.py labs/rollout-state/fixtures/progressing.json
          python labs/rollout-state/simulate.py labs/rollout-state/fixtures/rollback.json
