<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">归档可复现性：漂移来源与归一化步骤</title>
  <desc id="desc">上方展示默认打包的时间和元数据差异导致摘要漂移；下方展示固定路径顺序、tar 元数据和 gzip 时间后再计算摘要。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#175cd3"/>
    </marker>
  </defs>
  <rect width="1000" height="580" rx="18" fill="#f8fafc"/>
  <text x="500" y="42" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="25" font-weight="700" fill="#13315c">归档的字节来自两层元数据</text>

  <text x="45" y="94" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#b42318">默认打包：隐式输入会漂移</text>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" text-anchor="middle">
    <rect x="42" y="116" width="195" height="84" rx="12" fill="#fff1f0" stroke="#fda29b" stroke-width="2"/>
    <text x="139" y="148" fill="#7a271a"><tspan x="139">源文件树</tspan><tspan x="139" dy="24">遍历与文件顺序</tspan></text>
    <rect x="285" y="116" width="195" height="84" rx="12" fill="#fff1f0" stroke="#fda29b" stroke-width="2"/>
    <text x="382" y="148" fill="#7a271a"><tspan x="382">tar 头部</tspan><tspan x="382" dy="24">mtime / uid / mode</tspan></text>
    <rect x="528" y="116" width="195" height="84" rx="12" fill="#fff1f0" stroke="#fda29b" stroke-width="2"/>
    <text x="625" y="148" fill="#7a271a"><tspan x="625">gzip 头部</tspan><tspan x="625" dy="24">当前时间 / 文件名</tspan></text>
    <rect x="771" y="116" width="187" height="84" rx="12" fill="#fee4e2" stroke="#f04438" stroke-width="2"/>
    <text x="864" y="148" fill="#7a271a"><tspan x="864">压缩字节变化</tspan><tspan x="864" dy="24">SHA-256 不同</tspan></text>
  </g>
  <g stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <line x1="240" y1="158" x2="276" y2="158"/><line x1="483" y1="158" x2="519" y2="158"/><line x1="726" y1="158" x2="762" y2="158"/>
  </g>

  <line x1="42" y1="232" x2="958" y2="232" stroke="#d0d5dd" stroke-width="2"/>
  <text x="45" y="274" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="19" font-weight="700" fill="#175cd3">本实验：固定可控元数据，再压缩和摘要</text>

  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" text-anchor="middle">
    <rect x="35" y="302" width="166" height="90" rx="12" fill="#eff8ff" stroke="#84caff" stroke-width="2"/>
    <text x="118" y="335" fill="#1849a9"><tspan x="118">输入树</tspan><tspan x="118" dy="23">只读普通文件</tspan><tspan x="118" dy="20">拒绝符号链接</tspan></text>
    <rect x="225" y="302" width="166" height="90" rx="12" fill="#eff8ff" stroke="#84caff" stroke-width="2"/>
    <text x="308" y="335" fill="#1849a9"><tspan x="308">路径排序</tspan><tspan x="308" dy="23">POSIX 相对路径</tspan><tspan x="308" dy="20">字典序写入</tspan></text>
    <rect x="415" y="302" width="190" height="90" rx="12" fill="#eff8ff" stroke="#84caff" stroke-width="2"/>
    <text x="510" y="335" fill="#1849a9"><tspan x="510">tar 头部归一化</tspan><tspan x="510" dy="23">mtime / uid / gid</tspan><tspan x="510" dy="20">owner 名称 / mode</tspan></text>
    <rect x="629" y="302" width="160" height="90" rx="12" fill="#eff8ff" stroke="#84caff" stroke-width="2"/>
    <text x="709" y="335" fill="#1849a9"><tspan x="709">gzip</tspan><tspan x="709" dy="23">mtime = epoch</tspan><tspan x="709" dy="20">隐藏输出文件名</tspan></text>
    <rect x="813" y="302" width="151" height="90" rx="12" fill="#ecfdf3" stroke="#75e0a7" stroke-width="2"/>
    <text x="888" y="335" fill="#05603a"><tspan x="888">字节流</tspan><tspan x="888" dy="23">SHA-256</tspan><tspan x="888" dy="20">重复构建比较</tspan></text>
  </g>
  <g stroke="#175cd3" stroke-width="3" marker-end="url(#blueArrow)">
    <line x1="204" y1="347" x2="217" y2="347"/><line x1="394" y1="347" x2="407" y2="347"/><line x1="608" y1="347" x2="621" y2="347"/><line x1="792" y1="347" x2="805" y2="347"/>
  </g>

  <rect x="44" y="430" width="912" height="96" rx="14" fill="#eef4ff" stroke="#b2ccff"/>
  <text x="68" y="464" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#13315c">可复现边界</text>
  <text x="68" y="493" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" fill="#344054">相同输入字节 + 相同规则 + 相同 Python / zlib 工具链 → 预期得到相同归档字节。</text>
  <text x="68" y="516" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="14" fill="#475467">固定时间只是条件之一；本 tar.gz 实验不证明 Docker/OCI 镜像跨环境可复现。</text>
</svg>
